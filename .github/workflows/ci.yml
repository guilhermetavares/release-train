name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Verificação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar checagens
        run: |
          echo "Repositório: ${{ github.repository }}"
          echo "Branch:      ${{ github.ref_name }}"
          echo "Commit:      ${{ github.sha }}"
          echo "Autor:       ${{ github.actor }}"
          echo "-----------------------------"
          echo "Nenhuma checagem configurada ainda."

      - name: Resultado
        run: echo "✅ APROVADO"